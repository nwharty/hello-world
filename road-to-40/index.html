:root{
  color-scheme:light dark;
  --ink:#14281D; --paper:#F2F5F0; --panel:#FFFFFF;
  --cash:#2E7D4F; --cash-deep:#1B4D33; --cliff:#C4472F;
  --amber:#C98A2D; --line:#D8DFD6; --muted:#6B7A6F;
  --fin:#2E7D4F; --car:#2C5F8A; --fam:#B0533A; --hea:#7A4E8C; --hom:#8A6D2C; --per:#3E7C7B;
  --shadow:4px 4px 0 rgba(20,40,29,.12); --shadow-h:6px 6px 0 rgba(20,40,29,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#E6EFE8; --paper:#101812; --panel:#18221B;
    --cash:#5BBF8A; --cash-deep:#8FD9B0; --cliff:#F08A6E;
    --amber:#E3B05C; --line:#2C382F; --muted:#9AAB9F;
    --fin:#5BBF8A; --car:#7FB3E3; --fam:#EE9B7A; --hea:#C39BD9; --hom:#D9B36A; --per:#7FCBC8;
    --shadow:4px 4px 0 rgba(0,0,0,.45); --shadow-h:6px 6px 0 rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E6EFE8; --paper:#101812; --panel:#18221B;
  --cash:#5BBF8A; --cash-deep:#8FD9B0; --cliff:#F08A6E;
  --amber:#E3B05C; --line:#2C382F; --muted:#9AAB9F;
  --fin:#5BBF8A; --car:#7FB3E3; --fam:#EE9B7A; --hea:#C39BD9; --hom:#D9B36A; --per:#7FCBC8;
  --shadow:4px 4px 0 rgba(0,0,0,.45); --shadow-h:6px 6px 0 rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;padding:20px 14px 60px;max-width:880px;margin:0 auto}
.mono{font-family:'IBM Plex Mono',monospace}
.eyebrow-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cash-deep)}
h1{font-weight:900;font-size:clamp(26px,6vw,40px);line-height:1.02;letter-spacing:-.02em}
h1 .zero{color:var(--cash)}
.headline-stat{margin-top:14px;display:flex;gap:24px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:12px;margin-bottom:22px}
.hs .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hs .val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700}
.hs .val.red{color:var(--cliff)} .hs .val.green{color:var(--cash)}

.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:10px;padding:18px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.panel h2 .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Lane grid (home) */
.lane-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:22px}
.lane-card{
  background:var(--panel);border:1.5px solid var(--ink);border-radius:10px;padding:16px;
  cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%;
  font-family:'Archivo',sans-serif;color:var(--ink);
  border-left:6px solid var(--lc,var(--ink));
  transition:transform .12s ease;
}
.lane-card:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-h);background:var(--panel)}
.lane-card .name{font-weight:900;font-size:17px}
.lane-card .prog{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px}
.lane-card .bar{height:6px;background:var(--paper);border:1px solid var(--ink);border-radius:3px;margin-top:8px;overflow:hidden}
.lane-card .bar > div{height:100%;background:var(--lc,var(--cash))}

/* Lane detail */
.back{background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:14px;font-family:'Archivo',sans-serif}
.back:hover{background:var(--panel)}
.lane-title{font-weight:900;font-size:26px;margin-bottom:2px;border-left:8px solid var(--lc);padding-left:12px}
.lane-sub{font-size:12px;color:var(--muted);margin-bottom:16px;padding-left:20px}
.year-block{margin-bottom:16px}
.year-head{
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:6px;
}
.year-head .y{font-weight:900;font-size:16px}
.year-head .theme{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.goal{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.goal input[type=checkbox]{width:20px;height:20px;accent-color:var(--lc,var(--cash));margin-top:1px;flex-shrink:0;cursor:pointer}
.goal .txt{flex:1;font-size:14px;line-height:1.35;outline:none;border-radius:4px;padding:1px 3px}
.goal .txt:focus{background:var(--paper);outline:2px solid var(--lc)}
.goal.done .txt{text-decoration:line-through;color:var(--muted)}
.goal .del{background:none;border:none;color:var(--cliff);cursor:pointer;font-size:15px;padding:0 4px;flex-shrink:0}
.addgoal{background:none;border:1.5px dashed var(--muted);color:var(--muted);border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;font-family:'Archivo',sans-serif;width:100%}
.addgoal:hover{border-color:var(--ink);color:var(--ink)}
.hint{font-size:11px;color:var(--muted);font-style:italic;margin-top:10px}

/* Section divider inside Financial lane */
.sect-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;border-top:3px solid var(--ink);margin:28px 0 12px;padding-top:10px;font-weight:900;font-size:16px}
.sect-head .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Money tracker bits */
.balance-row{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 0 6px}
.balance{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:700;line-height:1}
.balance.dead{color:var(--cash);text-decoration:line-through;text-decoration-thickness:3px}
.countdown{text-align:right}
.countdown .days{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:var(--cliff)}
.countdown .sub{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.countdown.safe .days{color:var(--cash)}
.runway{position:relative;height:38px;margin:14px 0 4px}
.runway .track{position:absolute;inset:10px 0;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.runway .paid{position:absolute;top:0;left:0;bottom:0;background:var(--cash);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px);transition:width .5s ease}
.runway .cliff-line{position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--cliff)}
.runway .cliff-flag{position:absolute;right:0;top:-4px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;color:var(--cliff);letter-spacing:.06em}
.runway-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
.log-form{display:flex;gap:8px;margin-top:14px}
.log-form input{flex:1;font-family:'IBM Plex Mono',monospace;font-size:15px;padding:10px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);min-width:0;color:var(--ink)}
.log-form input:focus{outline:3px solid var(--cash);outline-offset:1px}
button.act{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:10px 16px;cursor:pointer}
button.act:hover{background:var(--cash-deep)}
button:focus-visible{outline:3px solid var(--cash);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Archivo',sans-serif}
button.ghost:hover{background:var(--panel)}
.history{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.history-item{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.history-item .del{background:none;border:none;color:var(--cliff);cursor:pointer;font-size:14px;padding:0 4px}
.empty-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:8px}
.wf{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.wf:last-child{border-bottom:none}
.wf input[type=checkbox]{width:22px;height:22px;accent-color:var(--cash);margin-top:2px;flex-shrink:0;cursor:pointer}
.wf .body{flex:1} .wf .title{font-weight:700;font-size:14px}
.wf .detail{font-size:12px;color:var(--muted);margin-top:2px}
.wf .amt{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;white-space:nowrap}
.wf.done .title{text-decoration:line-through;color:var(--muted)}
.wf.done .amt{color:var(--cash)}
.arrow{color:var(--cash);font-weight:900}
.ef-target-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.ef-target-row label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ef-target-row input{font-family:'IBM Plex Mono',monospace;font-size:15px;width:120px;padding:8px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink)}
.phase-lock{font-size:12px;color:var(--muted);background:var(--paper);border:1px dashed var(--muted);border-radius:6px;padding:10px 12px;margin-top:10px}
footer{margin-top:28px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:center;letter-spacing:.08em;text-transform:uppercase}

/* Passcode gate */
.gate{max-width:400px;margin:14vh auto 0}
.gate .glyph{font-size:28px;text-align:center;margin-bottom:8px}
.gate h2{font-size:18px;font-weight:900;text-align:center;justify-content:center}
.gate .sub{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.gate input{width:100%;font-family:'IBM Plex Mono',monospace;font-size:16px;padding:12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);margin-top:12px}
.gate input:focus{outline:3px solid var(--cash);outline-offset:1px}
.gate button.act{width:100%;margin-top:12px;padding:12px}
.gate .err{color:var(--cliff);font-size:12px;font-weight:700;margin-top:8px;min-height:16px;text-align:center}
.gate .note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.45}
@media(prefers-reduced-motion:reduce){.runway .paid{transition:none}.lane-card{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- data ---------- */
const FORTIETH = new Date('2030-09-16');
const BABY = new Date('2026-11-05');
const START = { c1: 11314.50, c2: 10000 };
const CLIFFS = { c1: new Date('2026-10-20'), c2: new Date('2027-07-01') };
const THEMES = { y37:'Roots', y38:'Build', y39:'Reach', y40:'The Marker' };
const YEAR_LABELS = { y37:'Year 37 · Sep 26–27', y38:'Year 38 · Sep 27–28', y39:'Year 39 · Sep 28–29', y40:'40 · Sep 2030' };

const LANES = [
  { id:'financial', name:'Financial', color:'var(--fin)', sub:'Debt payoff tracker · then build' },
  { id:'career',    name:'Career',    color:'var(--car)', sub:'Sonos → VP trajectory' },
  { id:'family',    name:'Family',    color:'var(--fam)', sub:'Four kids, one marriage, the letters' },
  { id:'health',    name:'Health',    color:'var(--hea)', sub:'Stronger at 40 than 35' },
  { id:'home',      name:'Home',      color:'var(--hom)', sub:'Pool, projects, done-ness' },
  { id:'personal',  name:'Personal',  color:'var(--per)', sub:'Something that is just yours' },
];

const DEFAULT_GOALS = {
financial:{
 y37:[ 'Credit cards to $0 before the baby (Aug RSU → Card 1, Sep bonus → Card 2)',
       '6-month emergency fund fully funded by 38th birthday (~$60K of Nov–Sep windfalls)',
       'Protection stack complete: wills + guardianship, umbrella policy, second term life policy (~$1.5–2M)' ],
 y38:[ 'Home equity loan: aggressive paydown begins (post-EF, ~$35–40K/yr pace)',
       'Max 401(k) + HSA contributions',
       'Define the "on track for 55" net worth number' ],
 y39:[ 'Home equity loan >50% paid down',
       'First taxable brokerage contributions beyond retirement accounts' ],
 y40:[ 'Home equity loan: $0 — debt-free except mortgage',
       'Net worth milestone hit' ]},
career:{
 y37:[ 'Execute 6+6 leave flawlessly — coverage plan documented, written record protected with Kruti',
       'Return strong from leave; no drift' ],
 y38:[ 'Explicit VP-track conversation with Kruti',
       'Own one high-visibility cross-functional initiative',
       'Expand Pricing Committee influence' ],
 y39:[ 'Promotion or a decision: reassess Sonos vs. market with fresh eyes',
       'Comp target: $400K+ trajectory visible' ],
 y40:[ 'VP or equivalent scope/comp — or a deliberate, chosen alternative' ]},
family:{
 y37:[ 'Baby #4 arrives healthy — fully present for it',
       'One-on-one days with Emily, Benji, and Maddy before November',
       "Start the new baby's letter book before the birth",
       'Write each kid one letter this year' ],
 y38:[ 'Two no-kids weekends with your wife',
       'Letters annual rhythm locked in',
       'First family pool summer traditions' ],
 y39:[ 'First full family trip with all four kids',
       'Emily hits double digits — mark it properly',
       'Letters continue' ],
 y40:[ 'Four thriving kids, marriage prioritized, every kid has a growing letter book' ]},
health:{
 y37:[ 'Maintain Thu/Sun lifts through newborn season — that IS the goal',
       "Protect sleep where possible — track Oura, don't obsess" ],
 y38:[ 'Set a strength benchmark and hit it (bench / deadlift / OHP — pick the number)',
       'HRV baseline recovered to pre-baby levels' ],
 y39:[ 'Add one endurance element (rucking, bike, run)',
       'Full physical + bloodwork baseline before 40' ],
 y40:[ 'Stronger at 40 than 35 — with labs to prove it' ]},
home:{
 y37:[ 'Pool installed and operational',
       'Living room done (Frame TV, slat wall, console) before leave starts' ],
 y38:[ 'Pool season one: landscaping/hardscaping matured',
       'Deferred maintenance list knocked out' ],
 y39:[ 'One meaningful upgrade — cash-flowed, not financed (kitchen / bath / outdoor kitchen)' ],
 y40:[ 'House fully "done" for this life stage — no open projects nagging' ]},
personal:{
 y37:[ 'Permission to explore nothing — the baby is the project',
       'Keep coaching Quabbin soccer' ],
 y38:[ 'Pick ONE side project and run it 12 months — or formally retire the search' ],
 y39:[ 'Finish the league website properly',
       'One thing with a finish line before 40 (event, certification, creation)' ],
 y40:[ 'A hobby or venture that is genuinely yours — not another optimization' ]}
};

/* ---------- state ---------- */
const store = {
  async get(k){
    if (window.storage) return window.storage.get(k);
    const v = localStorage.getItem(k);
    if (v === null) throw new Error('Key not found: ' + k);
    return { key: k, value: v };
  },
  async set(k, v){
    if (window.storage) return window.storage.set(k, v);
    localStorage.setItem(k, v);
    return { key: k, value: v };
  }
};

let state = null;
let view = { screen:'home', lane:null };

/* ---------- passcode gate ---------- */
const PASS_KEY = 'road-to-40-pass';
const PASS_SALT = 'r40·v1·';
let passHash = null;      // stored hash, null = not set up yet
let unlocked = false;     // this tab's unlock flag
try { unlocked = sessionStorage.getItem('r40-unlocked') === '1'; } catch(e){ /* sandboxed — in-memory only */ }

async function hashCode(str){
  const input = PASS_SALT + str;
  if (window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
    return 's256:' + Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h = 0x811c9dc5;
  for (let i = 0; i < input.length; i++){ h ^= input.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return 'fnv:' + h.toString(16);
}
function markUnlocked(){
  unlocked = true;
  try { sessionStorage.setItem('r40-unlocked','1'); } catch(e){}
}
function gateError(msg){ const el = document.getElementById('gateErr'); if (el) el.textContent = msg; }
async function setPasscode(){
  const a = document.getElementById('pass1').value;
  const b = document.getElementById('pass2').value;
  if (a.length < 4){ gateError('Use at least 4 characters.'); return; }
  if (a !== b){ gateError("Those don't match — try again."); return; }
  passHash = await hashCode(a);
  try { await store.set(PASS_KEY, passHash); } catch(e){ /* still unlock; will re-ask if storage is unavailable */ }
  markUnlocked(); render();
}
async function tryUnlock(){
  const v = document.getElementById('passin').value;
  if (await hashCode(v) === passHash){ markUnlocked(); render(); }
  else { gateError('Wrong passcode.'); document.getElementById('passin').select(); }
}
function lockNow(){
  unlocked = false;
  try { sessionStorage.removeItem('r40-unlocked'); } catch(e){}
  render();
}

function freshState(){
  const lanes = {};
  for (const l of LANES){
    lanes[l.id] = {};
    for (const y of ['y37','y38','y39','y40'])
      lanes[l.id][y] = DEFAULT_GOALS[l.id][y].map(t => ({text:t, done:false}));
  }
  return { lanes, tracker:{ payments:{c1:[],c2:[],ef:[]}, windfalls:{}, efTarget:55000 } };
}

async function load(){
  try{
    const p = await store.get(PASS_KEY);
    if (p && p.value) passHash = p.value;
  }catch(e){ /* no passcode yet — first run */ }
  state = freshState();
  try{
    const r = await store.get('road-to-40-state');
    if (r && r.value){ state = JSON.parse(r.value); render(); return; }
  }catch(e){ /* not found — check for old tracker data */ }
  try{
    const old = await store.get('debt-tracker-state');
    if (old && old.value){
      const t = JSON.parse(old.value);
      state.tracker = { payments: t.payments || state.tracker.payments,
                        windfalls: t.windfalls || {}, efTarget: t.efTarget || 55000 };
    }
  }catch(e){ /* no old data either — fresh start */ }
  save(); render();
}
let saveTimer=null, saving=false;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>doSave(0), 500); }
async function doSave(attempt){
  if (saving){ save(); return; }
  saving=true;
  try{
    await store.set('road-to-40-state', JSON.stringify(state));
    saving=false;
  }catch(e){
    saving=false;
    if (attempt < 4) setTimeout(()=>doSave(attempt+1), 800*(attempt+1));
    else console.error('Save failed after retries — your latest change may not persist. It will retry on your next edit.', e);
  }
}

/* ---------- helpers ---------- */
const fmt = n => '$' + n.toLocaleString('en-US',{maximumFractionDigits:0});
const sum = a => a.reduce((x,p)=>x+p.amt,0);
const daysTo = d => Math.max(0, Math.ceil((d-new Date())/(864e5)));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function laneProgress(id){
  let t=0,d=0;
  for (const y of ['y37','y38','y39','y40'])
    for (const g of state.lanes[id][y]){ t++; if(g.done) d++; }
  return t ? Math.round(d/t*100) : 0;
}

/* ---------- actions ---------- */
function openLane(id){ view={screen:'lane',lane:id}; render(); window.scrollTo(0,0); }
function goHome(){ view={screen:'home',lane:null}; render(); window.scrollTo(0,0); }
function toggleGoal(lane,y,i){ const g=state.lanes[lane][y][i]; g.done=!g.done; save(); render(); }
function editGoal(lane,y,i,el){ const v=el.textContent.trim(); if(v) state.lanes[lane][y][i].text=v; else el.textContent=state.lanes[lane][y][i].text; save(); }
function deleteGoal(lane,y,i){ state.lanes[lane][y].splice(i,1); save(); render(); }
function addGoal(lane,y){ state.lanes[lane][y].push({text:'New goal — tap to edit', done:false}); save(); render(); }
function logPayment(key){
  const input=document.getElementById(key+'input');
  const amt=parseFloat(input.value);
  if(!amt||amt<=0) return;
  state.tracker.payments[key].push({amt, date:new Date().toISOString().slice(0,10)});
  input.value=''; save(); render();
}
function deletePayment(key,i){ state.tracker.payments[key].splice(i,1); save(); render(); }
function toggleWindfall(id){ state.tracker.windfalls[id]=!state.tracker.windfalls[id]; save(); render(); }
function saveEfTarget(){ const v=parseFloat(document.getElementById('efTarget').value); if(v>0){state.tracker.efTarget=v; save(); render();} }

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  if (!passHash && !unlocked) app.innerHTML = renderSetup();
  else if (!unlocked) app.innerHTML = renderLock();
  else if (view.screen==='home') app.innerHTML = renderHome();
  else app.innerHTML = renderLane(view.lane);
  const focus=document.getElementById('pass1')||document.getElementById('passin');
  if (focus) focus.focus();
}

function renderSetup(){
  return `
  <div class="gate">
    <section class="panel">
      <div class="glyph">🔒</div>
      <h2>Set a passcode</h2>
      <div class="sub">First visit on this device — choose a passcode to gate the dashboard.</div>
      <input type="password" id="pass1" placeholder="New passcode (4+ characters)" autocomplete="new-password" aria-label="New passcode">
      <input type="password" id="pass2" placeholder="Repeat it" autocomplete="new-password" aria-label="Repeat passcode"
             onkeydown="if(event.key==='Enter')setPasscode()">
      <div class="err" id="gateErr"></div>
      <button class="act" onclick="setPasscode()">Set passcode &amp; open</button>
      <div class="note">The passcode is stored on this device as a hash, never as plain text. It's a light second layer — the real protection is that this page itself is private to your Claude account.</div>
    </section>
  </div>`;
}

function renderLock(){
  return `
  <div class="gate">
    <section class="panel">
      <div class="glyph">🔒</div>
      <h2>Road to 40</h2>
      <div class="sub">Enter your passcode to open the dashboard.</div>
      <input type="password" id="passin" placeholder="Passcode" autocomplete="current-password" aria-label="Passcode"
             onkeydown="if(event.key==='Enter')tryUnlock()">
      <div class="err" id="gateErr"></div>
      <button class="act" onclick="tryUnlock()">Unlock</button>
    </section>
  </div>`;
}

function pageFooter(){
  return `<footer>Road to 40 · Sep 16 2026 → Sep 16 2030 · Tap a lane · Tap goal text to edit</footer>`;
}

function renderHome(){
  const t=state.tracker;
  const debt = Math.max(0,START.c1-sum(t.payments.c1)) + Math.max(0,START.c2-sum(t.payments.c2));
  let done=0, total=0;
  for (const l of LANES) for (const y of ['y37','y38','y39','y40'])
    for (const g of state.lanes[l.id][y]){ total++; if(g.done) done++; }
  return `
  <header>
    <div class="eyebrow-row">
      <div class="eyebrow">Nathaniel Harty · The Plan</div>
      <button class="ghost" onclick="lockNow()" aria-label="Lock the dashboard">🔒 Lock</button>
    </div>
    <h1>ROAD TO <span class="zero">40.</span></h1>
    <div class="headline-stat">
      <div class="hs"><div class="lbl">Days to 40</div><div class="val">${daysTo(FORTIETH).toLocaleString()}</div></div>
      <div class="hs"><div class="lbl">Cards remaining</div><div class="val ${debt>0?'red':'green'}">${debt>0?fmt(debt):'$0 🎉'}</div></div>
      <div class="hs"><div class="lbl">Goals done</div><div class="val green">${done}/${total}</div></div>
      <div class="hs"><div class="lbl">Baby ETA</div><div class="val">~${daysTo(BABY)}d</div></div>
    </div>
  </header>
  <div class="lane-grid">
    ${LANES.map(l=>`
      <button class="lane-card" style="--lc:${l.color}" onclick="openLane('${l.id}')">
        <div class="name">${l.name}</div>
        <div class="prog">${laneProgress(l.id)}% complete · ${l.sub}</div>
        <div class="bar"><div style="width:${laneProgress(l.id)}%"></div></div>
      </button>`).join('')}
  </div>
  ${pageFooter()}`;
}

function renderLane(id){
  const lane=LANES.find(l=>l.id===id);
  const yearsHtml = ['y37','y38','y39','y40'].map(y=>`
    <div class="year-block" style="--lc:${lane.color}">
      <div class="year-head"><span class="y">${YEAR_LABELS[y]}</span><span class="theme">${THEMES[y]}</span></div>
      ${state.lanes[id][y].map((g,i)=>`
        <div class="goal ${g.done?'done':''}" style="--lc:${lane.color}">
          <input type="checkbox" ${g.done?'checked':''} onchange="toggleGoal('${id}','${y}',${i})" aria-label="Toggle goal">
          <div class="txt" contenteditable="true" onblur="editGoal('${id}','${y}',${i},this)">${esc(g.text)}</div>
          <button class="del" aria-label="Delete goal" onclick="deleteGoal('${id}','${y}',${i})">✕</button>
        </div>`).join('')}
      <button class="addgoal" onclick="addGoal('${id}','${y}')">＋ Add goal to ${YEAR_LABELS[y].split(' ·')[0]}</button>
    </div>`).join('');
  const trackerHtml = id==='financial'
    ? `<div class="sect-head"><span>Debt payoff &amp; emergency fund</span><span class="tag">live tracker</span></div>${renderTracker()}`
    : '';
  return `
    <button class="back" onclick="goHome()">← All lanes</button>
    <div class="lane-title" style="--lc:${lane.color}">${lane.name}</div>
    <div class="lane-sub">${lane.sub} · tap any goal text to edit it</div>
    ${yearsHtml}
    ${trackerHtml}
    <div class="hint">Edits save automatically.</div>
    ${pageFooter()}`;
}

function renderTracker(){
  const t=state.tracker;
  const paid1=sum(t.payments.c1), paid2=sum(t.payments.c2), ef=sum(t.payments.ef);
  const bal1=Math.max(0,START.c1-paid1), bal2=Math.max(0,START.c2-paid2);
  const efPct=Math.min(100, ef/t.efTarget*100);
  const WF=[
    {id:'jul',title:'July cash-flow payment',detail:'Regular surplus, pre-baby peak',amt:1300,target:'Card 1'},
    {id:'aug',title:'Aug 15 RSU vest',detail:'Net of taxes · kills Card 1 two months early',amt:10000,target:'Card 1'},
    {id:'sep',title:'September quarterly bonus',detail:'Net · kills Card 2 ten months early',amt:10000,target:'Card 2'},
  ];
  const hist=(key)=> t.payments[key].length
    ? t.payments[key].map((p,i)=>`<div class="history-item"><span>${p.date}</span><span>${fmt(p.amt)} <button class="del" aria-label="Delete" onclick="deletePayment('${key}',${i})">✕</button></span></div>`).join('')
    : '<div class="empty-note">No payments logged yet.</div>';
  return `
  <section class="panel">
    <h2>Card 1 · BoA ···3215 <span class="tag">0% dies Oct 20 2026 → 19.49%</span></h2>
    <div class="balance-row">
      <div class="balance ${bal1===0?'dead':''}">${bal1===0?'DEAD 🎉':fmt(bal1)}</div>
      <div class="countdown ${bal1===0?'safe':''}"><div class="days">${daysTo(CLIFFS.c1)}</div><div class="sub">days to cliff</div></div>
    </div>
    <div class="runway"><div class="track"><div class="paid" style="width:${Math.min(100,paid1/START.c1*100)}%"></div></div><div class="cliff-line"></div><div class="cliff-flag">▲ 19.49% APR</div></div>
    <div class="runway-labels"><span>start $11,314</span><span>$0</span></div>
    <div class="log-form"><input type="number" id="c1input" placeholder="Payment amount" inputmode="decimal" aria-label="Card 1 payment"><button class="act" onclick="logPayment('c1')">Log payment</button></div>
    <div class="history">${hist('c1')}</div>
  </section>
  <section class="panel">
    <h2>Card 2 · BofA/Merrill transfer <span class="tag">0% dies Jul 2027 → 18.49%</span></h2>
    <div class="balance-row">
      <div class="balance ${bal2===0?'dead':''}">${bal2===0?'DEAD 🎉':fmt(bal2)}</div>
      <div class="countdown safe"><div class="days">${daysTo(CLIFFS.c2)}</div><div class="sub">days to cliff</div></div>
    </div>
    <div class="runway"><div class="track"><div class="paid" style="width:${Math.min(100,paid2/START.c2*100)}%"></div></div><div class="cliff-line"></div><div class="cliff-flag">▲ 18.49% APR</div></div>
    <div class="runway-labels"><span>start $10,000</span><span>$0</span></div>
    <div class="log-form"><input type="number" id="c2input" placeholder="Payment amount" inputmode="decimal" aria-label="Card 2 payment"><button class="act" onclick="logPayment('c2')">Log payment</button></div>
    <div class="history">${hist('c2')}</div>
  </section>
  <section class="panel">
    <h2>The kill sequence <span class="tag">windfalls → debt</span></h2>
    ${WF.map(w=>`
      <div class="wf ${t.windfalls[w.id]?'done':''}">
        <input type="checkbox" ${t.windfalls[w.id]?'checked':''} onchange="toggleWindfall('${w.id}')" aria-label="${w.title}">
        <div class="body"><div class="title">${w.title} <span class="arrow">→ ${w.target}</span></div><div class="detail">${w.detail}</div></div>
        <div class="amt">${fmt(w.amt)}</div>
      </div>`).join('')}
  </section>
  <section class="panel">
    <h2>Phase 2 · Emergency fund <span class="tag">unlocks when cards hit $0</span></h2>
    <div class="ef-target-row"><label for="efTarget">6-mo target $</label><input type="number" id="efTarget" value="${t.efTarget}" inputmode="numeric"><button class="ghost" onclick="saveEfTarget()">Set</button></div>
    <div class="balance-row">
      <div class="balance" style="color:var(--cash)">${fmt(ef)}</div>
      <div class="countdown safe"><div class="days">${efPct.toFixed(0)}%</div><div class="sub">funded</div></div>
    </div>
    <div class="runway"><div class="track"><div class="paid" style="width:${efPct}%"></div></div></div>
    <div class="log-form"><input type="number" id="efinput" placeholder="Contribution amount" inputmode="decimal" aria-label="EF contribution"><button class="act" onclick="logPayment('ef')">Log</button></div>
    <div class="history">${hist('ef')}</div>
    <div class="phase-lock">Fuel schedule once cards are dead: Nov '26 RSU · Dec '26 bonus · Feb '27 RSU · Mar '27 bonus · May '27 RSU · Jun '27 bonus ≈ <span class="mono">$60K</span> of windfalls by your 38th birthday.</div>
  </section>`;
}

load();
</script>

</body>
</html>
